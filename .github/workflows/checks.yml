name: checks

on:
  push:
    branches: [master]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 파서/정책 계층만 설치한다. fetcher 런타임(브라우저)은 CI 에 필요 없다 —
      # 아래 검사들은 전부 네트워크를 타지 않는다.
      - name: Install
        run: pip install scrapling protego openpyxl pytest

      # e2e 는 제외한다. 실제 사이트를 치는 테스트를 CI 에서 매 PR 마다 돌리면
      # 데이터센터 IP 로 제3자 서버에 반복 부하를 주게 된다 — 이 저장소가 사용자에게
      # 지키라고 말하는 '부담' 조건을 저장소 자신이 어기는 셈이다.
      - name: Unit tests
        run: python -m pytest -q -k "not e2e"

      # 생성물 드리프트 — 배포 화이트리스트가 분류기와 어긋나면 여기서 걸린다.
      - name: Generated blocks are in sync
        run: |
          python scripts/sync_domain_list.py --check
          python scripts/sync_codex_mirror.py --check
