<script>
  let allReviews = [];
  let filteredReviews = [];
  let displayCount = 50;
  let parsedItemsToImport = [];
  // Evidence drilldown state
  let activeEvidenceTerm = null;   // currently selected keyword string
  let activeEvidenceIsLow = false; // true = came from low-rating badge

  document.addEventListener('DOMContentLoaded', function() {
    initEvents();
    fetchDashboardData();
  });

  function initEvents() {
    document.getElementById('filterProduct').addEventListener('change', applyFilters);
    document.getElementById('filterStartDate').addEventListener('change', applyFilters);
    document.getElementById('filterEndDate').addEventListener('change', applyFilters);
    document.getElementById('filterRating').addEventListener('change', applyFilters);
    document.getElementById('filterKeyword').addEventListener('input', applyFilters);
    document.getElementById('btnResetFilters').addEventListener('click', resetFilters);
    document.getElementById('btnLoadMore').addEventListener('click', function() {
      displayCount += 50;
      renderReviewCards();
    });

    // Import Modal Listeners
    document.getElementById('btnOpenImportModal').addEventListener('click', openImportModal);
    document.getElementById('btnCloseImportModal').addEventListener('click', closeImportModal);
    document.getElementById('btnCancelImport').addEventListener('click', closeImportModal);
    document.getElementById('xlsxFileInput').addEventListener('change', handleFileSelect);
    document.getElementById('btnConfirmImport').addEventListener('click', confirmImport);
  }

  function fetchDashboardData() {
    showState('loading');
    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(onDataLoaded)
        .withFailureHandler(onDataError)
        .getReviewDashboardData();
    } else {
      // Mock/Local preview fallback if accessed outside Apps Script environment
      setTimeout(function() {
        if (window.mockDashboardData) {
          onDataLoaded({ status: 'success', data: window.mockDashboardData, fetchedAt: new Date().toISOString() });
        } else {
          onDataError(new Error("Apps Script 런타임 환경에서 실행해 주세요."));
        }
      }, 500);
    }
  }

  function onDataLoaded(response) {
    if (!response || response.status === 'error') {
      onDataError(new Error(response ? response.message : "Unknown error"));
      return;
    }

    allReviews = response.data || [];
    
    // Set fetched time
    const fetchedAt = response.fetchedAt ? new Date(response.fetchedAt).toLocaleString('ko-KR') : new Date().toLocaleString('ko-KR');
    document.getElementById('lastFetchedTime').textContent = fetchedAt;

    populateProductDropdown();
    applyFilters();
    showState('content');
  }

  function onDataError(error) {
    console.error("Dashboard Data Fetch Error:", error);
    const msg = error && error.message ? error.message : "리뷰 데이터를 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.";
    document.getElementById('errorMessage').textContent = msg;
    showState('error');
  }

  function showState(state) {
    const loadingState = document.getElementById('loadingState');
    const errorState = document.getElementById('errorState');
    const reviewListSection = document.getElementById('reviewListSection');

    loadingState.style.display = 'none';
    errorState.style.display = 'none';

    if (state === 'loading') {
      loadingState.style.display = 'block';
    } else if (state === 'error') {
      errorState.style.display = 'block';
    } else if (state === 'content') {
      reviewListSection.style.display = 'block';
    }
  }

  function populateProductDropdown() {
    const select = document.getElementById('filterProduct');
    select.innerHTML = '<option value="all">전체 제품</option>';

    const productMap = new Map();
    allReviews.forEach(function(item) {
      if (item.product_id && !productMap.has(item.product_id)) {
        productMap.set(item.product_id, {
          id: item.product_id,
          brand: item.brand || '',
          name: item.product_name || item.product_id
        });
      }
    });

    productMap.forEach(function(prod) {
      const opt = document.createElement('option');
      opt.value = prod.id;
      const brandPrefix = prod.brand ? '[' + prod.brand + '] ' : '';
      opt.textContent = brandPrefix + prod.name;
      select.appendChild(opt);
    });
  }

  function resetFilters() {
    document.getElementById('filterProduct').value = 'all';
    document.getElementById('filterStartDate').value = '';
    document.getElementById('filterEndDate').value = '';
    document.getElementById('filterRating').value = 'all';
    document.getElementById('filterKeyword').value = '';
    applyFilters();
  }

  /* ==========================================================================
     Keyword Intelligence Helper & Functions
     ========================================================================== */

  const DEFAULT_STOPWORDS = new Set([
    '그리고', '하지만', '정말', '너무', '그냥', '있는', '없는', '합니다', '했어요', '입니다',
    '있는것', '같아요', '하고', '해서', '하면', '이거', '이것', '하나', '것도', '많이',
    '아주', '조금', '다시', '지금', '되어', '되면', '까지', '부터', '으로', '에게', '한테',
    '바로', '사용할', '있어서', '없이', '있어요', '다양한', '있고', '있는데', '있습니다', '있었어요',
    '사용하기', '사용해서', '사용하면',
    'the', 'and', 'for', 'this', 'that', 'with', 'from', 'they', 'them', 'what', 'have', 'has', 'had', 'were', 'will', 'would', 'could', 'should'
  ]);

  function extractReviewTokens(text) {
    if (!text) return [];
    // Lowercase Latin, replace non-alphanumeric & non-hangul with space
    const cleaned = String(text).toLowerCase().replace(/[^a-zA-Z0-9\u3131-\u318E\uAC00-\uD7A3\s]/g, ' ');
    const rawTokens = cleaned.split(/\s+/);
    
    const validTokens = [];
    rawTokens.forEach(t => {
      const token = t.trim();
      if (!token) return;
      if (token.length < 2) return;
      if (/^\d+$/.test(token)) return; // Discard numeric-only
      if (DEFAULT_STOPWORDS.has(token)) return; // Discard stopwords
      validTokens.push(token);
    });
    return validTokens;
  }

  function calculateKeywordFrequencies(reviewList, maxTerms, minCount) {
    maxTerms = maxTerms || 12;
    minCount = minCount || 2;
    if (!reviewList || reviewList.length === 0) return [];

    const freqMap = new Map();

    reviewList.forEach(r => {
      const text = r.review_text || '';
      const tokens = extractReviewTokens(text);
      // Review occurrence frequency: duplicate terms within a single review count ONCE
      const uniqueReviewTerms = new Set(tokens);
      uniqueReviewTerms.forEach(term => {
        freqMap.set(term, (freqMap.get(term) || 0) + 1);
      });
    });

    const items = [];
    freqMap.forEach((count, term) => {
      if (count >= minCount) {
        items.push({ term: term, count: count });
      }
    });

    // Sort: 1. count DESC, 2. term ASC (deterministic tie-breaker)
    items.sort((a, b) => {
      if (b.count !== a.count) {
        return b.count - a.count;
      }
      return a.term.localeCompare(b.term);
    });

    return items.slice(0, maxTerms);
  }

  function renderKeywordIntelligence(structurallyFilteredReviews) {
    const activeKeyword = document.getElementById('filterKeyword').value.trim().toLowerCase();

    // 1. Overall Keywords (from all structurally filtered reviews)
    const overallKeywords = calculateKeywordFrequencies(structurallyFilteredReviews, 12, 2);
    renderBadgeList('overallKeywordBadges', overallKeywords, false, activeKeyword);

    // 2. Low-Rating Keywords (from structurally filtered reviews with 1 <= rating <= 3)
    const lowRatingReviews = structurallyFilteredReviews.filter(r => {
      const ratingNum = parseFloat(r.rating);
      return !isNaN(ratingNum) && ratingNum >= 1 && ratingNum <= 3;
    });
    const lowRatingKeywords = calculateKeywordFrequencies(lowRatingReviews, 12, 2);
    renderBadgeList('lowRatingKeywordBadges', lowRatingKeywords, true, activeKeyword);
  }

  function renderBadgeList(containerId, keywordList, isLowRating, activeKeyword) {
    const container = document.getElementById(containerId);
    if (!container) return;

    container.innerHTML = '';

    if (!keywordList || keywordList.length === 0) {
      const emptyDiv = document.createElement('div');
      emptyDiv.className = 'keyword-empty';
      emptyDiv.textContent = '분석 가능한 빈출 키워드가 없습니다.';
      container.appendChild(emptyDiv);
      return;
    }

    const fragment = document.createDocumentFragment();
    keywordList.forEach(function(item) {
      const isActive = activeKeyword && item.term.toLowerCase() === activeKeyword;
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'keyword-badge' + (isLowRating ? ' low-rating-badge' : '') + (isActive ? ' active' : '');
      btn.setAttribute('aria-label', item.term + ' 키워드 드릴다운');

      const termSpan = document.createElement('span');
      termSpan.className = 'badge-term';
      termSpan.textContent = item.term;

      const countSpan = document.createElement('span');
      countSpan.className = 'badge-count';
      countSpan.textContent = item.count;

      btn.appendChild(termSpan);
      btn.appendChild(countSpan);

      const termVal = item.term;
      const lowVal = !!isLowRating;
      btn.addEventListener('click', function() {
        onKeywordBadgeClick(termVal, lowVal);
      });

      fragment.appendChild(btn);
    });

    container.appendChild(fragment);
  }

  /* ==========================================================================
     Priority Signal Intelligence Functions (A5)
     ========================================================================== */

  function calculatePrioritySignals(structurallyFilteredReviews) {
    if (!structurallyFilteredReviews || structurallyFilteredReviews.length === 0) {
      return [];
    }

    const population = structurallyFilteredReviews;
    const popCount = population.length;

    // 1. Candidate Keywords: union of overall top 12 and low-rating top 12
    const overallKw = calculateKeywordFrequencies(population, 12, 2);
    const lowRatingReviews = population.filter(function(r) {
      const ratingNum = parseFloat(r.rating);
      return !isNaN(ratingNum) && ratingNum >= 1 && ratingNum <= 3;
    });
    const lowKw = calculateKeywordFrequencies(lowRatingReviews, 12, 2);

    const candidateMap = new Map();
    overallKw.forEach(function(item) {
      candidateMap.set(item.term, item.term);
    });
    lowKw.forEach(function(item) {
      candidateMap.set(item.term, item.term);
    });

    const candidateTerms = Array.from(candidateMap.keys());
    if (candidateTerms.length === 0) {
      return [];
    }

    const lowPopCount = lowRatingReviews.length;

    const signals = candidateTerms.map(function(term) {
      const termLower = term.toLowerCase();

      // Overall Prevalence & Low-Rating Counts (review_text matching only)
      let overallReviewCount = 0;
      let lowRatingKeywordCount = 0;

      population.forEach(function(r) {
        const text = (r.review_text || '').toLowerCase();
        if (text.includes(termLower)) {
          overallReviewCount++;
          const ratingNum = parseFloat(r.rating);
          if (!isNaN(ratingNum) && ratingNum >= 1 && ratingNum <= 3) {
            lowRatingKeywordCount++;
          }
        }
      });

      const overallMentionRate = popCount > 0 ? (overallReviewCount / popCount) * 100 : 0;
      const lowRatingMentionRate = lowPopCount > 0 ? (lowRatingKeywordCount / lowPopCount) * 100 : 0;
      const lowRatingShareOfKeyword = overallReviewCount > 0 ? (lowRatingKeywordCount / overallReviewCount) * 100 : 0;

      // 2. Recent Trend (from current structurally filtered population)
      const monthMap = {};
      population.forEach(function(r) {
        if (!r.review_date || typeof r.review_date !== 'string') return;
        const dateStr = r.review_date.trim();
        if (dateStr.length < 7) return;
        const monthStr = dateStr.substring(0, 7);
        if (!/^\d{4}-\d{2}$/.test(monthStr)) return;

        if (!monthMap[monthStr]) {
          monthMap[monthStr] = { month: monthStr, eligibleCount: 0, matchCount: 0 };
        }
        monthMap[monthStr].eligibleCount += 1;
        const text = (r.review_text || '').toLowerCase();
        if (text.includes(termLower)) {
          monthMap[monthStr].matchCount += 1;
        }
      });

      const sortedMonths = Object.keys(monthMap).sort();
      let hasValidTrend = false;
      let trendDeltaPctPoint = null;
      let latestMonthKeywordCount = 0;

      if (sortedMonths.length >= 2) {
        const latestMonthKey = sortedMonths[sortedMonths.length - 1];
        const prevMonthKey = sortedMonths[sortedMonths.length - 2];
        const latestBucket = monthMap[latestMonthKey];
        const prevBucket = monthMap[prevMonthKey];

        if (latestBucket.eligibleCount > 0 && prevBucket.eligibleCount > 0) {
          const latestRate = (latestBucket.matchCount / latestBucket.eligibleCount) * 100;
          const prevRate = (prevBucket.matchCount / prevBucket.eligibleCount) * 100;
          trendDeltaPctPoint = parseFloat((latestRate - prevRate).toFixed(1));
          latestMonthKeywordCount = latestBucket.matchCount;
          hasValidTrend = true;
        }
      }

      // 3. Product Concentration
      const compData = getKeywordProductComparison(term, false);
      let topProductMentionRate = 0;
      let topProductKeywordCount = 0;
      let topProductName = '';

      if (compData && compData.length > 0) {
        const topProd = compData[0];
        topProductMentionRate = topProd.mentionRate || 0;
        topProductKeywordCount = topProd.keywordReviewCount || 0;
        topProductName = topProd.productName || '';
      }

      const evidenceCount = overallReviewCount;

      // Deterministic Priority Rules (A, B, C, D)
      const condA = (lowRatingShareOfKeyword >= 50.0 && lowRatingKeywordCount >= 3);
      const condB = (hasValidTrend && trendDeltaPctPoint !== null && trendDeltaPctPoint >= 5.0 && latestMonthKeywordCount >= 3);
      const condC = (topProductMentionRate >= 20.0 && topProductKeywordCount >= 3);
      const condD = (overallMentionRate >= 15.0 && overallReviewCount >= 5);

      const highCondCount = (condA ? 1 : 0) + (condB ? 1 : 0) + (condC ? 1 : 0) + (condD ? 1 : 0);

      const medFallbackA = (lowRatingShareOfKeyword >= 40.0 && lowRatingKeywordCount >= 2);
      const medFallbackB = (hasValidTrend && trendDeltaPctPoint !== null && trendDeltaPctPoint >= 3.0 && latestMonthKeywordCount >= 2);

      let priorityLevel = 'WATCH';
      let priorityScore = 1;
      let triggeredConditionsCount = highCondCount;

      if (highCondCount >= 2) {
        priorityLevel = 'HIGH';
        priorityScore = 3;
      } else if (highCondCount >= 1 || medFallbackA || medFallbackB) {
        priorityLevel = 'MEDIUM';
        priorityScore = 2;
        triggeredConditionsCount = highCondCount + (medFallbackA && !condA ? 1 : 0) + (medFallbackB && !condB ? 1 : 0);
      }

      // Deterministic Reasons Generation
      const reasons = [];
      if (condA) {
        reasons.push('언급 리뷰 중 저평점 비중 ' + Math.round(lowRatingShareOfKeyword) + '%');
      } else if (medFallbackA) {
        reasons.push('언급 리뷰 중 저평점 비중 ' + Math.round(lowRatingShareOfKeyword) + '%');
      }

      if (condB) {
        const sign = trendDeltaPctPoint >= 0 ? '+' : '';
        reasons.push('최근 월 언급률 ' + sign + trendDeltaPctPoint.toFixed(1) + '%p');
      } else if (medFallbackB) {
        const sign = trendDeltaPctPoint >= 0 ? '+' : '';
        reasons.push('최근 월 언급률 ' + sign + trendDeltaPctPoint.toFixed(1) + '%p');
      }

      if (condC) {
        const prodPrefix = topProductName ? topProductName + ' ' : '';
        reasons.push(prodPrefix + '언급률 ' + topProductMentionRate.toFixed(1) + '%');
      }

      if (condD) {
        reasons.push('전체 언급률 ' + overallMentionRate.toFixed(1) + '%');
      }

      if (reasons.length === 0) {
        if (lowRatingKeywordCount > 0) {
          reasons.push('저평점 ' + lowRatingKeywordCount + '건 언급');
        } else {
          reasons.push('전체 ' + overallReviewCount + '건 언급');
        }
      }

      return {
        term: term,
        priorityLevel: priorityLevel,
        priorityScore: priorityScore,
        triggeredConditionsCount: triggeredConditionsCount,
        reasons: reasons,
        overallReviewCount: overallReviewCount,
        overallMentionRate: parseFloat(overallMentionRate.toFixed(1)),
        lowRatingKeywordCount: lowRatingKeywordCount,
        lowRatingMentionRate: parseFloat(lowRatingMentionRate.toFixed(1)),
        lowRatingShareOfKeyword: parseFloat(lowRatingShareOfKeyword.toFixed(1)),
        trendDeltaPctPoint: hasValidTrend ? trendDeltaPctPoint : null,
        latestMonthKeywordCount: latestMonthKeywordCount,
        hasValidTrend: hasValidTrend,
        topProductMentionRate: parseFloat(topProductMentionRate.toFixed(1)),
        topProductKeywordCount: topProductKeywordCount,
        topProductName: topProductName,
        evidenceCount: evidenceCount
      };
    });

    // Deterministic Sort Order:
    // 1. priorityScore DESC (HIGH > MEDIUM > WATCH)
    // 2. triggeredConditionsCount DESC
    // 3. lowRatingShareOfKeyword DESC
    // 4. trendDeltaPctPoint DESC (null treated as -999)
    // 5. overallReviewCount DESC
    // 6. term ASC (localeCompare tie-breaker)
    signals.sort(function(a, b) {
      if (b.priorityScore !== a.priorityScore) {
        return b.priorityScore - a.priorityScore;
      }
      if (b.triggeredConditionsCount !== a.triggeredConditionsCount) {
        return b.triggeredConditionsCount - a.triggeredConditionsCount;
      }
      if (b.lowRatingShareOfKeyword !== a.lowRatingShareOfKeyword) {
        return b.lowRatingShareOfKeyword - a.lowRatingShareOfKeyword;
      }
      const trendA = a.trendDeltaPctPoint !== null ? a.trendDeltaPctPoint : -999;
      const trendB = b.trendDeltaPctPoint !== null ? b.trendDeltaPctPoint : -999;
      if (trendB !== trendA) {
        return trendB - trendA;
      }
      if (b.overallReviewCount !== a.overallReviewCount) {
        return b.overallReviewCount - a.overallReviewCount;
      }
      return a.term.localeCompare(b.term);
    });

    return signals.slice(0, 10);
  }

  function renderPrioritySignals(structurallyFilteredReviews) {
    const container = document.getElementById('prioritySignalGrid');
    if (!container) return;

    container.innerHTML = '';

    const signals = calculatePrioritySignals(structurallyFilteredReviews);
    const activeKeyword = document.getElementById('filterKeyword').value.trim().toLowerCase();

    if (!signals || signals.length === 0) {
      const emptyDiv = document.createElement('div');
      emptyDiv.className = 'priority-empty';
      emptyDiv.textContent = '현재 조건에서 우선 확인할 키워드가 없습니다.';
      container.appendChild(emptyDiv);
      return;
    }

    const fragment = document.createDocumentFragment();
    signals.forEach(function(item) {
      const isActive = activeKeyword && item.term.toLowerCase() === activeKeyword;
      const card = document.createElement('div');
      card.className = 'priority-card' + (isActive ? ' active' : '');
      card.setAttribute('role', 'button');
      card.setAttribute('tabindex', '0');
      card.setAttribute('aria-label', item.term + ' 우선 확인 신호 드릴다운');

      // Header (Term + Badge)
      const header = document.createElement('div');
      header.className = 'priority-card-header';

      const termEl = document.createElement('div');
      termEl.className = 'priority-card-term';
      termEl.textContent = item.term;

      const badge = document.createElement('span');
      let badgeLabel = '추적';
      let badgeClass = 'priority-badge-watch';

      if (item.priorityLevel === 'HIGH') {
        badgeLabel = '우선 확인';
        badgeClass = 'priority-badge-high';
      } else if (item.priorityLevel === 'MEDIUM') {
        badgeLabel = '관찰';
        badgeClass = 'priority-badge-medium';
      }

      badge.className = 'priority-badge ' + badgeClass;
      badge.textContent = badgeLabel;

      header.appendChild(termEl);
      header.appendChild(badge);
      card.appendChild(header);

      // Reasons List
      const ul = document.createElement('ul');
      ul.className = 'priority-reasons';

      item.reasons.forEach(function(reasonText) {
        const li = document.createElement('li');
        li.className = 'priority-reason-item';
        li.textContent = reasonText;
        ul.appendChild(li);
      });

      card.appendChild(ul);

      // Safe click listener (reuses A2 Evidence, A3 Trend, A4 Product Comparison)
      const termVal = item.term;
      card.addEventListener('click', function() {
        onKeywordBadgeClick(termVal, false);
      });

      card.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          onKeywordBadgeClick(termVal, false);
        }
      });

      fragment.appendChild(card);
    });

    container.appendChild(fragment);
  }

  function onKeywordBadgeClick(term, isLowRating) {
    const keywordInput = document.getElementById('filterKeyword');
    if (keywordInput) {
      keywordInput.value = term;
    }
    activeEvidenceTerm = term;
    activeEvidenceIsLow = !!isLowRating;
    applyFilters();
    showKeywordEvidence(term, !!isLowRating);
  }

  function applyFilters() {
    const selectedProd = document.getElementById('filterProduct').value;
    const startDate = document.getElementById('filterStartDate').value;
    const endDate = document.getElementById('filterEndDate').value;
    const selectedRating = document.getElementById('filterRating').value;
    const keyword = document.getElementById('filterKeyword').value.trim().toLowerCase();

    // Population for Keyword Widget (structural filters only - prevents recursive collapse)
    const structurallyFilteredReviews = allReviews.filter(function(r) {
      // Product Filter
      if (selectedProd !== 'all' && r.product_id !== selectedProd) {
        return false;
      }

      // Date Filter
      const rDateStr = r.review_date ? r.review_date.substring(0, 10) : '';
      if (startDate && rDateStr < startDate) {
        return false;
      }
      if (endDate && rDateStr > endDate) {
        return false;
      }

      // Rating Filter
      if (selectedRating !== 'all' && Math.floor(r.rating) !== parseInt(selectedRating, 10)) {
        return false;
      }

      return true;
    });

    // Population for Review Cards & KPIs (includes keyword search filter)
    filteredReviews = structurallyFilteredReviews.filter(function(r) {
      if (keyword) {
        const text = (r.review_text || '').toLowerCase();
        const opt = (r.product_option || '').toLowerCase();
        const name = (r.product_name || '').toLowerCase();
        const brand = (r.brand || '').toLowerCase();
        if (!text.includes(keyword) && !opt.includes(keyword) && !name.includes(keyword) && !brand.includes(keyword)) {
          return false;
        }
      }

      return true;
    });

    // Sort by review_date descending by default
    filteredReviews.sort(function(a, b) {
      return (b.review_date || '').localeCompare(a.review_date || '');
    });

    displayCount = 50;

    updateKPIs();
    renderMonthlyChart();
    renderRatingBarChart();
    renderPrioritySignals(structurallyFilteredReviews);
    renderKeywordIntelligence(structurallyFilteredReviews);
    renderReviewCards();

    // Refresh or clear evidence panel if active
    if (activeEvidenceTerm) {
      const termMatch = keyword === activeEvidenceTerm.toLowerCase();
      if (!keyword || !termMatch) {
        // Keyword input cleared OR manually changed to a different term -> clear evidence
        _hideEvidencePanel();
      } else {
        // Same keyword: structural filter changed while evidence open -> re-render for new population
        showKeywordEvidence(activeEvidenceTerm, activeEvidenceIsLow);
      }
    }
  }

  /* ==========================================================================
     Evidence Drilldown Functions
     ========================================================================== */

  function getEvidenceReviews(term, isLowRating) {
    // Source population: structurally filtered (same as keyword ranking)
    const selectedProd = document.getElementById('filterProduct').value;
    const startDate = document.getElementById('filterStartDate').value;
    const endDate = document.getElementById('filterEndDate').value;
    const selectedRating = document.getElementById('filterRating').value;

    let population = allReviews.filter(function(r) {
      if (selectedProd !== 'all' && r.product_id !== selectedProd) return false;
      const rDateStr = r.review_date ? r.review_date.substring(0, 10) : '';
      if (startDate && rDateStr < startDate) return false;
      if (endDate && rDateStr > endDate) return false;
      if (selectedRating !== 'all' && Math.floor(r.rating) !== parseInt(selectedRating, 10)) return false;
      return true;
    });

    // For low-rating keyword, restrict to valid 1..3 stars (same contract as low-rating widget)
    if (isLowRating) {
      population = population.filter(function(r) {
        const ratingNum = parseFloat(r.rating);
        return !isNaN(ratingNum) && ratingNum >= 1 && ratingNum <= 3;
      });
    }

    // Match only on review_text (NOT product_option alone)
    const termLower = term.toLowerCase();
    const matched = population.filter(function(r) {
      const text = (r.review_text || '').toLowerCase();
      return text.includes(termLower);
    });

    // Deterministic ordering: review_date DESC, rating ASC, review_id as stable tie-breaker
    matched.sort(function(a, b) {
      const dateCmp = (b.review_date || '').localeCompare(a.review_date || '');
      if (dateCmp !== 0) return dateCmp;
      const ratingA = parseFloat(a.rating) || 0;
      const ratingB = parseFloat(b.rating) || 0;
      if (ratingA !== ratingB) return ratingA - ratingB;
      return (a.review_id || '').localeCompare(b.review_id || '');
    });

    return matched;
  }

  function highlightKeywordInText(escapedText, escapedTerm) {
    // escapedText and escapedTerm are already HTML-escaped.
    // Replace escaped occurrences of the term (case-insensitive) with <mark> highlight.
    // We operate purely on the escaped string so no XSS is possible.
    if (!escapedTerm) return escapedText;
    // Build a safe regex from the escaped term (special regex chars in the escaped string are literal)
    const safePattern = escapedTerm.replace(/[-[\]{}()*+?.,\\^$|#\s]/g, '\\$&');
    const re = new RegExp('(' + safePattern + ')', 'gi');
    return escapedText.replace(re, '<mark class="evidence-highlight">$1</mark>');
  }

  function getKeywordMonthlyTrend(term, isLowRating) {
    if (!term) return [];

    const selectedProd = document.getElementById('filterProduct').value;
    const startDate = document.getElementById('filterStartDate').value;
    const endDate = document.getElementById('filterEndDate').value;
    const selectedRating = document.getElementById('filterRating').value;

    let population = allReviews.filter(function(r) {
      if (selectedProd !== 'all' && r.product_id !== selectedProd) return false;
      const rDateStr = r.review_date ? r.review_date.substring(0, 10) : '';
      if (startDate && rDateStr < startDate) return false;
      if (endDate && rDateStr > endDate) return false;
      if (selectedRating !== 'all' && Math.floor(r.rating) !== parseInt(selectedRating, 10)) return false;
      return true;
    });

    if (isLowRating) {
      population = population.filter(function(r) {
        const ratingNum = parseFloat(r.rating);
        return !isNaN(ratingNum) && ratingNum >= 1 && ratingNum <= 3;
      });
    }

    const termLower = term.toLowerCase();
    const monthMap = {};

    population.forEach(function(r) {
      if (!r.review_date || typeof r.review_date !== 'string') return;
      const dateStr = r.review_date.trim();
      if (dateStr.length < 7) return;
      const monthStr = dateStr.substring(0, 7);
      if (!/^\d{4}-\d{2}$/.test(monthStr)) return;

      if (!monthMap[monthStr]) {
        monthMap[monthStr] = { month: monthStr, eligibleCount: 0, matchCount: 0 };
      }

      monthMap[monthStr].eligibleCount += 1;

      const text = (r.review_text || '').toLowerCase();
      if (text.includes(termLower)) {
        monthMap[monthStr].matchCount += 1;
      }
    });

    const months = Object.keys(monthMap).sort(function(a, b) {
      return a.localeCompare(b);
    });

    return months.map(function(m) {
      const bucket = monthMap[m];
      const eligible = bucket.eligibleCount;
      const matched = bucket.matchCount;
      const rate = eligible > 0 ? (matched / eligible) * 100 : 0;
      return {
        month: m,
        eligibleReviewCount: eligible,
        keywordReviewCount: matched,
        mentionRate: parseFloat(rate.toFixed(1))
      };
    });
  }

  function renderKeywordTrend(term, isLowRating) {
    const container = document.getElementById('keywordTrendSection');
    if (!container) return;

  function getKeywordProductComparison(term, isLowRating) {
    if (!term) return [];

    const startDate = document.getElementById('filterStartDate').value;
    const endDate = document.getElementById('filterEndDate').value;
    const selectedRating = document.getElementById('filterRating').value;

    // Cross-product population: IGNORE current product filter value!
    let population = allReviews.filter(function(r) {
      // Date Filter
      const rDateStr = r.review_date ? r.review_date.substring(0, 10) : '';
      if (startDate && rDateStr < startDate) return false;
      if (endDate && rDateStr > endDate) return false;

      // Rating Filter
      if (selectedRating !== 'all' && Math.floor(r.rating) !== parseInt(selectedRating, 10)) return false;

      return true;
    });

    // Low-rating mode restriction: strictly valid ratings 1..3
    if (isLowRating) {
      population = population.filter(function(r) {
        const ratingNum = parseFloat(r.rating);
        return !isNaN(ratingNum) && ratingNum >= 1 && ratingNum <= 3;
      });
    }

    const termLower = term.toLowerCase();
    const prodMap = {};

    population.forEach(function(r) {
      const domain = (r.source_domain || 'unknown').trim();
      const pId = (r.product_id || r.product_name || 'unknown').trim();
      const pKey = domain + '::' + pId;
      const pName = (r.product_name || r.product_id || '알 수 없는 상품').trim();
      const brand = (r.brand || '').trim();

      if (!prodMap[pKey]) {
        prodMap[pKey] = {
          productKey: pKey,
          productName: pName,
          brand: brand,
          sourceDomain: domain,
          eligibleReviewCount: 0,
          keywordReviewCount: 0
        };
      }

      prodMap[pKey].eligibleReviewCount += 1;

      // review_text ONLY matching
      const text = (r.review_text || '').toLowerCase();
      if (text.includes(termLower)) {
        prodMap[pKey].keywordReviewCount += 1;
      }
    });

    const items = Object.keys(prodMap).map(function(key) {
      const p = prodMap[key];
      const eligible = p.eligibleReviewCount;
      const matched = p.keywordReviewCount;
      const rate = eligible > 0 ? (matched / eligible) * 100 : 0;
      return {
        productKey: p.productKey,
        productName: p.productName,
        brand: p.brand,
        sourceDomain: p.sourceDomain,
        eligibleReviewCount: eligible,
        keywordReviewCount: matched,
        mentionRate: parseFloat(rate.toFixed(1))
      };
    }).filter(function(item) {
      return item.eligibleReviewCount > 0;
    });

    items.sort(function(a, b) {
      if (b.mentionRate !== a.mentionRate) {
        return b.mentionRate - a.mentionRate;
      }
      if (b.keywordReviewCount !== a.keywordReviewCount) {
        return b.keywordReviewCount - a.keywordReviewCount;
      }
      if (b.eligibleReviewCount !== a.eligibleReviewCount) {
        return b.eligibleReviewCount - a.eligibleReviewCount;
      }
      return a.productKey.localeCompare(b.productKey);
    });

    return items.slice(0, 10);
  }

    // Title: '{term}' 관련 리뷰 근거 · N건

    titleEl.textContent = '\u2018' + term + '\u2019 ' + (isLowRating ? '[저평점] ' : '') + '관련 리뷰 근거 \u00b7 ' + total.toLocaleString() + '건';

    let html = '<div class="evidence-items">';

    }

  }

  function updateKPIs() {
    const total = filteredReviews.length;
    document.getElementById('kpiTotalReviews').textContent = total.toLocaleString();

    // Average Rating
    if (total === 0) {
      document.getElementById('kpiAverageRating').textContent = '0.00';
      document.getElementById('kpiRatingStars').textContent = '☆☆☆☆☆';
    } else {
      const sum = filteredReviews.reduce((acc, curr) => acc + (curr.rating || 0), 0);
      const avg = sum / total;
      document.getElementById('kpiAverageRating').textContent = avg.toFixed(2);
      document.getElementById('kpiRatingStars').textContent = getStarString(avg);
    }

    // Recent 30 Days (Current Date Based)
    const now = Date.now();
    const thirtyDaysAgoMs = now - (30 * 24 * 60 * 60 * 1000);
    const recent30DaysCount = filteredReviews.filter(r => {
      const t = new Date(r.review_date).getTime();
      return !isNaN(t) && t >= thirtyDaysAgoMs && t <= now;
    }).length;

    document.getElementById('kpiRecent30Days').textContent = recent30DaysCount.toLocaleString();

    // Photo Review Rate
    const photoCount = filteredReviews.filter(r => r.photo_review).length;
    const photoRate = total === 0 ? 0 : Math.round((photoCount / total) * 100);
    document.getElementById('kpiPhotoRate').textContent = photoRate + '%';
    document.getElementById('kpiPhotoCount').textContent = `포토 리뷰 ${photoCount}건 / 총 ${total}건`;
  }

  function getStarString(rating) {
    const rounded = Math.round(rating);
    let stars = '';
    for (let i = 1; i <= 5; i++) {
      stars += (i <= rounded) ? '★' : '☆';
    }
    return stars;
  }

  function renderMonthlyChart() {
    const container = document.getElementById('svgMonthlyChart');
    if (filteredReviews.length === 0) {
      container.innerHTML = '<div style="text-align:center; padding-top:80px; color:var(--text-muted);">데이터가 없습니다</div>';
      return;
    }

    // Aggregate by YYYY-MM
    const monthlyMap = new Map();
    filteredReviews.forEach(r => {
      if (r.review_date) {
        const ym = r.review_date.substring(0, 7);
        if (ym && ym.length === 7) {
          monthlyMap.set(ym, (monthlyMap.get(ym) || 0) + 1);
        }
      }
    });

    const sortedMonths = Array.from(monthlyMap.keys()).sort();
    if (sortedMonths.length === 0) {
      container.innerHTML = '<div style="text-align:center; padding-top:80px; color:var(--text-muted);">월별 데이터가 없습니다</div>';
      return;
    }

    const dataPoints = sortedMonths.map(ym => ({ month: ym, count: monthlyMap.get(ym) }));
    const maxCount = Math.max(...dataPoints.map(d => d.count), 1);

    // SVG parameters
    const svgWidth = 600;
    const svgHeight = 180;
    const paddingLeft = 40;
    const paddingRight = 40;
    const paddingTop = 20;
    const paddingBottom = 35;

    const chartW = svgWidth - paddingLeft - paddingRight;
    const chartH = svgHeight - paddingTop - paddingBottom;

    let pathD = '';
    const points = [];

    dataPoints.forEach((pt, index) => {
      const x = (dataPoints.length === 1) 
        ? paddingLeft + chartW / 2 
        : paddingLeft + (index / (dataPoints.length - 1)) * chartW;
      
      const y = paddingTop + chartH - (pt.count / maxCount) * chartH;
      points.push({ x, y, month: pt.month, count: pt.count });

      if (index === 0) {
        pathD += `M ${x} ${y}`;
      } else {
        pathD += ` L ${x} ${y}`;
      }
    });

    let svgHtml = `<svg viewBox="0 0 ${svgWidth} ${svgHeight}" preserveAspectRatio="none" style="width:100%; height:100%;">`;
    
    // Background Grid lines
    for (let i = 0; i <= 3; i++) {
      const gy = paddingTop + (chartH / 3) * i;
      svgHtml += `<line x1="${paddingLeft}" y1="${gy}" x2="${svgWidth - paddingRight}" y2="${gy}" stroke="var(--border-color)" stroke-dasharray="3,3" opacity="0.5"/>`;
    }

    // Line Path
    if (points.length > 1) {
      svgHtml += `<path d="${pathD}" fill="none" stroke="var(--accent-blue)" stroke-width="3" stroke-linecap="round"/>`;
    }

    // Points & Labels
    points.forEach(pt => {
      svgHtml += `<circle cx="${pt.x}" cy="${pt.y}" r="5" fill="var(--bg-main)" stroke="var(--accent-blue)" stroke-width="3"/>`;
      svgHtml += `<text x="${pt.x}" y="${pt.y - 10}" text-anchor="middle" fill="var(--text-primary)" font-size="12" font-weight="600">${pt.count}</text>`;
      svgHtml += `<text x="${pt.x}" y="${svgHeight - 10}" text-anchor="middle" fill="var(--text-muted)" font-size="11">${pt.month.substring(2)}</text>`;
    });

    svgHtml += `</svg>`;
    container.innerHTML = svgHtml;
  }

  function escapeHtml(str) {
    if (!str) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  function handleFileSelect(event) {
    const file = event.target.files[0];
    if (!file) return;

    document.getElementById('selectedFileNameDisplay').textContent = file.name;
    document.getElementById('importResultMessage').style.display = 'none';

    if (typeof XLSX === 'undefined') {
      showImportResult('error', 'XLSX 파싱 라이브러리를 로드하지 못했습니다. 네트워크 연결을 확인해 주세요.');
      return;
    }

    const reader = new FileReader();
    reader.onload = function(e) {
      try {
        const data = new Uint8Array(e.target.result);
        const workbook = XLSX.read(data, { type: 'array', cellDates: true });
        
        if (!workbook.SheetNames || workbook.SheetNames.length === 0) {
          showImportResult('error', 'Excel 파일 내에 시트가 존재하지 않습니다.');
          return;
        }

        const firstSheetName = workbook.SheetNames[0];
        const worksheet = workbook.Sheets[firstSheetName];
        const rawRows = XLSX.utils.sheet_to_json(worksheet, { defval: "" });

        processParsedRows(file.name, firstSheetName, rawRows);
      } catch (err) {
        console.error("Excel File Read Error:", err);
        showImportResult('error', 'Excel 파일을 읽는 도중 오류가 발생했습니다: ' + (err.message || String(err)));
      }
    };
    reader.readAsArrayBuffer(file);
  }

  function processParsedRows(fileName, sheetName, rawRows) {
    const requiredHeaders = [
      "source_domain", "product_id", "product_name", "brand",
      "review_id", "review_date", "rating", "review_text",
      "product_option", "helpful_count", "photo_review",
      "video_review", "collected_at"
    ];

    document.getElementById('previewFileName').textContent = fileName;
    document.getElementById('previewSheetName').textContent = sheetName;

    if (rawRows.length === 0) {
      document.getElementById('importPreviewContainer').style.display = 'block';
      document.getElementById('statReceivedCount').textContent = '0';
      document.getElementById('statNewCount').textContent = '0';
      document.getElementById('statDedupCount').textContent = '0';
      document.getElementById('statInvalidCount').textContent = '0';
      document.getElementById('btnConfirmImport').disabled = true;
      document.getElementById('btnConfirmImport').textContent = '신규 데이터 반영 (0건)';
      return;
    }

    const sampleRowKeys = Object.keys(rawRows[0]).map(k => String(k).trim().toLowerCase());
    const missingHeaders = requiredHeaders.filter(h => sampleRowKeys.indexOf(h) === -1);

    const headerErrorBox = document.getElementById('previewHeaderError');
    if (missingHeaders.length > 0) {
      headerErrorBox.style.display = 'block';
      document.getElementById('missingHeadersText').textContent = missingHeaders.join(', ');
    } else {
      headerErrorBox.style.display = 'none';
    }

    const existingKeySet = new Set();
    allReviews.forEach(r => {
      if (r.source_domain && r.product_id && r.review_id) {
        existingKeySet.add(makeReviewDedupKey(r.source_domain, r.product_id, r.review_id));
      }
    });

    const fileBatchKeySet = new Set();
    let newItems = [];
    let fileDedupCount = 0;
    let existingDedupCount = 0;
    let invalidCount = 0;
    const invalidReasons = [];

    rawRows.forEach((row, idx) => {
      const rowNum = idx + 2;
      const sourceDomain = getRowVal(row, 'source_domain');
      const productId = getRowVal(row, 'product_id');
      const reviewId = getRowVal(row, 'review_id');

      if (!sourceDomain || !productId || !reviewId) {
        invalidCount++;
        if (invalidReasons.length < 5) {
          invalidReasons.push(`Row ${rowNum}: 필수 키(source_domain, product_id, review_id) 누락`);
        }
        return;
      }

      const key = makeReviewDedupKey(sourceDomain, productId, reviewId);

      if (existingKeySet.has(key)) {
        existingDedupCount++;
        return;
      }

      if (fileBatchKeySet.has(key)) {
        fileDedupCount++;
        return;
      }

      fileBatchKeySet.add(key);

      const parsedItem = {
        crawl_id: getRowVal(row, 'crawl_id'),
        source_domain: sourceDomain,
        product_id: productId,
        product_name: getRowVal(row, 'product_name'),
        brand: getRowVal(row, 'brand'),
        review_id: reviewId,
        review_date: getRowVal(row, 'review_date'),
        rating: parseFloat(getRowVal(row, 'rating')) || 0,
        review_text: getRowVal(row, 'review_text'),
        product_option: getRowVal(row, 'product_option'),
        helpful_count: parseInt(getRowVal(row, 'helpful_count'), 10) || 0,
        photo_review: parseBoolVal(getRowVal(row, 'photo_review')),
        video_review: parseBoolVal(getRowVal(row, 'video_review')),
        collected_at: getRowVal(row, 'collected_at') || new Date().toISOString()
      };

      newItems.push(parsedItem);
    });

    parsedItemsToImport = newItems;
    const totalDedupCount = existingDedupCount + fileDedupCount;

    document.getElementById('statReceivedCount').textContent = rawRows.length.toLocaleString();
    document.getElementById('statNewCount').textContent = newItems.length.toLocaleString();
    document.getElementById('statDedupCount').textContent = totalDedupCount.toLocaleString();
    document.getElementById('statInvalidCount').textContent = invalidCount.toLocaleString();

    const invalidDetailsBox = document.getElementById('previewInvalidDetails');
    const invalidList = document.getElementById('invalidReasonsList');
    if (invalidReasons.length > 0) {
      invalidDetailsBox.style.display = 'block';
      invalidList.innerHTML = invalidReasons.map(r => `<li>${escapeHtml(r)}</li>`).join('');
    } else {
      invalidDetailsBox.style.display = 'none';
    }

    document.getElementById('importPreviewContainer').style.display = 'block';

    const btnConfirm = document.getElementById('btnConfirmImport');
    if (missingHeaders.length > 0 || newItems.length === 0) {
      btnConfirm.disabled = true;
      btnConfirm.textContent = `신규 데이터 반영 (0건)`;
    } else {
      btnConfirm.disabled = false;
      btnConfirm.textContent = `신규 데이터 반영 (${newItems.length.toLocaleString()}건)`;
    }
  }

  function getRowVal(rowObj, targetKey) {
    if (!rowObj) return '';
    const keys = Object.keys(rowObj);
    const matchKey = keys.find(k => String(k).trim().toLowerCase() === targetKey);
    if (matchKey !== undefined && rowObj[matchKey] !== undefined && rowObj[matchKey] !== null) {
      const val = rowObj[matchKey];
      if (val instanceof Date) return val.toISOString();
      return String(val).trim();
    }
    return '';
  }

  function parseBoolVal(val) {
    if (typeof val === 'boolean') return val;
    const str = String(val).trim().toLowerCase();
    return str === 'true' || str === '1' || str === 'yes' || str === 'y';
  }

  function confirmImport() {
    if (parsedItemsToImport.length === 0) return;

    const btnConfirm = document.getElementById('btnConfirmImport');
    btnConfirm.disabled = true;
    btnConfirm.textContent = '반영 중...';

    const selectedFileName = document.getElementById('selectedFileNameDisplay').textContent || '';

    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(onImportSuccess)
        .withFailureHandler(onImportError)
        .importReviewData(parsedItemsToImport, selectedFileName);
    } else {
      // Mock / Local preview fallback
      setTimeout(function() {
        onImportSuccess({
          status: 'success',
          received: parsedItemsToImport.length,
          inserted: parsedItemsToImport.length,
          skipped_duplicate: 0,
          invalid: 0
        });
      }, 600);
    }
  }

  function onImportSuccess(response) {
    const btnConfirm = document.getElementById('btnConfirmImport');
    btnConfirm.disabled = true;

    if (!response || response.status === 'error') {
      onImportError(new Error(response ? response.message : 'Import 중 오류 발생'));
      return;
    }

    showImportResult('success', `✅ 성공: 신규 데이터 ${response.inserted}건이 01_REVIEW_RAW에 반영되었습니다. (중복 제외: ${response.skipped_duplicate}건, 오류 제외: ${response.invalid}건)`);
    
    // Refresh Dashboard Data
    fetchDashboardData();

    setTimeout(function() {
      closeImportModal();
    }, 2500);
  }

  function onImportError(error) {
    const btnConfirm = document.getElementById('btnConfirmImport');
    btnConfirm.disabled = false;
    btnConfirm.textContent = `신규 데이터 반영 (${parsedItemsToImport.length}건)`;

    const msg = error && error.message ? error.message : '데이터 반영 중 오류가 발생했습니다.';
    showImportResult('error', `❌ 오류: ${msg}`);
  }

  function showImportResult(type, text) {
    const box = document.getElementById('importResultMessage');
    box.className = `import-result-box ${type}`;
    box.textContent = text;
    box.style.display = 'block';
  }
</script>
