<style>
  :root {
    --bg-main: #0f172a;
    --bg-card: #1e293b;
    --bg-card-hover: #334155;
    --border-color: #334155;
    --border-highlight: #475569;
    --text-primary: #f8fafc;
    --text-secondary: #94a3b8;
    --text-muted: #64748b;
    --accent-blue: #38bdf8;
    --accent-indigo: #818cf8;
    --accent-gold: #fbbf24;
    --accent-emerald: #34d399;
    --accent-rose: #f43f5e;
    --radius-lg: 16px;
    --radius-md: 10px;
    --radius-sm: 6px;
    --font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    background-color: var(--bg-main);
    color: var(--text-primary);
    font-family: var(--font-family);
    line-height: 1.5;
    min-height: 100vh;
    padding: 24px 16px;
  }

  .container {
    max-width: 1280px;
    margin: 0 auto;
  }

  /* Header */
  .dashboard-header {
    margin-bottom: 24px;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    flex-wrap: wrap;
    gap: 16px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border-color);
  }

  .header-titles h1 {
    font-size: 1.75rem;
    font-weight: 700;
    color: var(--text-primary);
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .header-titles h1 span.logo-badge {
    background: linear-gradient(135deg, var(--accent-blue), var(--accent-indigo));
    color: #fff;
    font-size: 0.75rem;
    padding: 4px 10px;
    border-radius: 20px;
    font-weight: 600;
    letter-spacing: 0.5px;
  }

  .header-titles p {
    font-size: 0.95rem;
    color: var(--text-secondary);
    margin-top: 4px;
  }

  .header-meta {
    font-size: 0.825rem;
    color: var(--text-muted);
    background-color: rgba(30, 41, 59, 0.6);
    padding: 6px 14px;
    border-radius: 20px;
    border: 1px solid var(--border-color);
  }

  /* KPI Grid */
  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    margin-bottom: 24px;
  }

  .kpi-card {
    background-color: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-lg);
    padding: 20px 24px;
    transition: transform 0.2s ease, border-color 0.2s ease;
    position: relative;
    overflow: hidden;
  }

  .kpi-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 4px;
    height: 100%;
    background: var(--accent-blue);
  }

  .kpi-card.kpi-rating::before { background: var(--accent-gold); }
  .kpi-card.kpi-recent::before { background: var(--accent-indigo); }
  .kpi-card.kpi-photo::before { background: var(--accent-emerald); }

  .kpi-card:hover {
    transform: translateY(-2px);
    border-color: var(--border-highlight);
  }

  .kpi-label {
    font-size: 0.875rem;
    font-weight: 500;
    color: var(--text-secondary);
    margin-bottom: 8px;
  }

  .kpi-value {
    font-size: 2rem;
    font-weight: 700;
    color: var(--text-primary);
    line-height: 1.2;
  }

  .kpi-sub {
    font-size: 0.8rem;
    color: var(--text-muted);
    margin-top: 6px;
  }

  /* Filter Bar */
  .filter-bar {
    background-color: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-lg);
    padding: 16px 20px;
    margin-bottom: 24px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)) auto;
    gap: 14px;
    align-items: flex-end;
  }

  .filter-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .filter-group label {
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .filter-control {
    background-color: var(--bg-main);
    border: 1px solid var(--border-color);
    color: var(--text-primary);
    padding: 10px 14px;
    border-radius: var(--radius-md);
    font-size: 0.9rem;
    font-family: inherit;
    outline: none;
    transition: border-color 0.2s ease;
    width: 100%;
  }

  .filter-control:focus {
    border-color: var(--accent-blue);
  }

  .date-range-group {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .btn-reset {
    background-color: rgba(244, 63, 94, 0.15);
    border: 1px solid rgba(244, 63, 94, 0.3);
    color: var(--accent-rose);
    padding: 10px 18px;
    border-radius: var(--radius-md);
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
    white-space: nowrap;
    height: 42px;
  }

  .btn-reset:hover {
    background-color: var(--accent-rose);
    color: #fff;
  }

  /* Charts Section */
  .charts-grid {
    display: grid;
    grid-template-columns: 1.5fr 1fr;
    gap: 20px;
    margin-bottom: 24px;
  }

  .chart-card {
    background-color: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-lg);
    padding: 20px 24px;
  }

  .chart-title {
    font-size: 1rem;
    font-weight: 600;
    color: var(--text-primary);
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  /* Rating Distribution Bar Chart */
  .rating-bars {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .rating-bar-row {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 0.875rem;
  }

  .rating-star-label {
    width: 48px;
    color: var(--accent-gold);
    font-weight: 600;
  }

  .bar-track {
    flex: 1;
    height: 12px;
    background-color: var(--bg-main);
    border-radius: 6px;
    overflow: hidden;
    position: relative;
  }

  .bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent-gold), #f59e0b);
    border-radius: 6px;
    transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .rating-count-label {
    width: 60px;
    text-align: right;
    color: var(--text-secondary);
    font-size: 0.825rem;
  }

  /* SVG Monthly Chart */
  .svg-chart-container {
    width: 100%;
    height: 200px;
    position: relative;
  }

  /* Review List Header */
  .review-list-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }

  .review-list-title {
    font-size: 1.1rem;
    font-weight: 600;
  }

  .review-count-badge {
    font-size: 0.85rem;
    color: var(--text-secondary);
    background-color: var(--bg-card);
    padding: 4px 12px;
    border-radius: 14px;
    border: 1px solid var(--border-color);
  }

  /* Review Cards List */
  .review-cards-list {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .review-card {
    background-color: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-md);
    padding: 18px 20px;
    transition: border-color 0.2s ease, transform 0.15s ease;
  }

  .review-card:hover {
    border-color: var(--border-highlight);
  }

  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
    flex-wrap: wrap;
    gap: 8px;
  }

  .card-stars {
    color: var(--accent-gold);
    font-size: 1rem;
    letter-spacing: 2px;
  }

  .card-date {
    font-size: 0.8rem;
    color: var(--text-muted);
  }

  .card-product-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 12px;
    flex-wrap: wrap;
  }

  .brand-pill {
    background-color: rgba(56, 189, 248, 0.15);
    color: var(--accent-blue);
    font-size: 0.75rem;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: var(--radius-sm);
  }

  .product-name-text {
    font-size: 0.875rem;
    font-weight: 600;
    color: var(--text-primary);
  }

  .option-pill {
    background-color: var(--bg-main);
    color: var(--text-secondary);
    font-size: 0.775rem;
    padding: 2px 8px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border-color);
  }

  .card-body {
    font-size: 0.95rem;
    color: #e2e8f0;
    line-height: 1.6;
    margin-bottom: 12px;
    word-break: break-word;
    white-space: pre-line;
  }

  .card-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.8rem;
    color: var(--text-muted);
    border-top: 1px dashed rgba(255, 255, 255, 0.07);
    padding-top: 10px;
  }

  .badge-group {
    display: flex;
    gap: 6px;
  }

  .media-badge {
    font-size: 0.725rem;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 12px;
  }

  .badge-photo {
    background-color: rgba(129, 140, 248, 0.18);
    color: var(--accent-indigo);

  }

  .badge-video {
    background-color: rgba(52, 211, 153, 0.18);
    color: var(--accent-emerald);
  }

  .btn-load-more {
    display: block;
    width: 100%;
    padding: 14px;
    margin-top: 20px;
    background-color: var(--bg-card);
    border: 1px solid var(--border-color);
    color: var(--text-primary);
    font-size: 0.95rem;
    font-weight: 600;
    border-radius: var(--radius-md);
    cursor: pointer;
    transition: background-color 0.2s ease, border-color 0.2s ease;
    text-align: center;
  }

  .btn-load-more:hover {
    background-color: var(--bg-card-hover);
    border-color: var(--border-highlight);
  }

  /* States: Loading, Empty, Error */
  .state-container {
    text-align: center;
    padding: 60px 20px;
    background-color: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-lg);
    margin: 20px 0;
  }

  .spinner {
    width: 40px;
    height: 40px;
    border: 4px solid rgba(255, 255, 255, 0.1);
    border-left-color: var(--accent-blue);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 16px;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .state-title {
    font-size: 1.1rem;
    font-weight: 600;
    margin-bottom: 8px;
  }

  .state-desc {
    font-size: 0.9rem;
    color: var(--text-secondary);
    max-width: 400px;
    margin: 0 auto 16px;
  }

  .btn-retry {
    background-color: var(--accent-blue);
    color: var(--bg-main);
    font-weight: 700;
    border: none;
    padding: 10px 20px;
    border-radius: var(--radius-md);
    cursor: pointer;
  }

  /* Responsive Adjustments */
  @media (max-width: 992px) {
    .kpi-grid {
      grid-template-columns: repeat(2, 1fr);
    }

    .charts-grid {
      grid-template-columns: 1fr;
    }
  }

  @media (max-width: 640px) {
    body {
      padding: 16px 10px;
    }

    .kpi-grid {
      grid-template-columns: 1fr;
    }

    .filter-bar {
      grid-template-columns: 1fr;
    }

    .dashboard-header {
      flex-direction: column;
      align-items: flex-start;
    }
  }

  /* Import Button & Header Actions */
  .header-actions {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  .btn-import {
    background: linear-gradient(135deg, var(--accent-blue), var(--accent-indigo));
    color: #fff;
    border: none;
    padding: 10px 18px;
    border-radius: var(--radius-md);
    font-size: 0.875rem;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.2s ease, opacity 0.2s ease;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  .btn-import:hover {
    transform: translateY(-1px);
    opacity: 0.95;
  }

  /* Modal Overlay & Card */
  .modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background-color: rgba(15, 23, 42, 0.8);
    backdrop-filter: blur(4px);
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .modal-content {
    background-color: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-lg);
    width: 100%;
    max-width: 640px;
    max-height: 90vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
  }

  .modal-header {
    padding: 20px 24px;
    border-bottom: 1px solid var(--border-color);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .modal-header h2 {
    font-size: 1.25rem;
    font-weight: 700;
    color: var(--text-primary);
  }

  .modal-close {
    background: none;
    border: none;
    color: var(--text-muted);
    font-size: 1.5rem;
    cursor: pointer;
    padding: 0 4px;
  }

  .modal-close:hover {
    color: var(--text-primary);
  }

  .modal-body {
    padding: 24px;
    overflow-y: auto;
    flex: 1;
  }

  .import-notice {
    font-size: 0.875rem;
    color: var(--text-secondary);
    background-color: var(--bg-main);
    padding: 14px 16px;
    border-radius: var(--radius-md);
    border: 1px solid var(--border-color);
    margin-bottom: 20px;
    line-height: 1.6;
  }

  .file-drop-zone {
    border: 2px dashed var(--border-highlight);
    border-radius: var(--radius-md);
    padding: 24px 20px;
    text-align: center;
    background-color: rgba(15, 23, 42, 0.4);
    margin-bottom: 20px;
    transition: border-color 0.2s ease;
  }

  .file-drop-zone:hover {
    border-color: var(--accent-blue);
  }

  .btn-select-file {
    background-color: var(--bg-card);
    border: 1px solid var(--border-highlight);
    color: var(--text-primary);
    padding: 10px 20px;
    border-radius: var(--radius-md);
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    transition: background-color 0.2s ease;
  }

  .btn-select-file:hover {
    background-color: var(--bg-card-hover);
  }

  .selected-filename {
    font-size: 0.85rem;
    color: var(--text-muted);
    margin-top: 10px;
    word-break: break-all;
  }

  /* Preview Box */
  .import-preview-box {
    background-color: var(--bg-main);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-md);
    padding: 18px 20px;
    margin-bottom: 20px;
  }

  .preview-meta-row {
    display: flex;
    justify-content: space-between;
    font-size: 0.85rem;
    color: var(--text-secondary);
    margin-bottom: 14px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--border-color);
    flex-wrap: wrap;
    gap: 8px;
  }

  .preview-stats-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }

  .stat-badge {
    text-align: center;
    padding: 10px 8px;
    border-radius: var(--radius-md);
    border: 1px solid var(--border-color);
    background-color: var(--bg-card);
  }

  .stat-num {
    font-size: 1.35rem;
    font-weight: 700;
  }

  .stat-lbl {
    font-size: 0.725rem;
    color: var(--text-muted);
    margin-top: 2px;
  }

  .badge-received .stat-num { color: var(--text-primary); }
  .badge-new .stat-num { color: var(--accent-emerald); }
  .badge-dedup .stat-num { color: var(--accent-gold); }
  .badge-invalid .stat-num { color: var(--accent-rose); }

  .invalid-details-box {
    margin-top: 14px;
    background-color: rgba(244, 63, 94, 0.1);
    border: 1px solid rgba(244, 63, 94, 0.3);
    border-radius: var(--radius-md);
    padding: 12px 14px;
    font-size: 0.8rem;
  }

  .invalid-title {
    color: var(--accent-rose);
    font-weight: 600;
    margin-bottom: 6px;
  }

  .invalid-list {
    color: var(--text-secondary);
    padding-left: 18px;
    max-height: 120px;
    overflow-y: auto;
  }

  .header-error-box {
    margin-top: 14px;
    background-color: rgba(244, 63, 94, 0.15);
    border: 1px solid rgba(244, 63, 94, 0.4);
    color: var(--accent-rose);
    border-radius: var(--radius-md);
    padding: 12px 14px;
    font-size: 0.85rem;
  }

  .import-result-box {
    padding: 14px 16px;
    border-radius: var(--radius-md);
    font-size: 0.9rem;
    line-height: 1.5;
    margin-bottom: 16px;
  }

  .import-result-box.success {
    background-color: rgba(52, 211, 153, 0.15);
    border: 1px solid rgba(52, 211, 153, 0.4);
    color: var(--accent-emerald);
  }

  .import-result-box.error {
    background-color: rgba(244, 63, 94, 0.15);
    border: 1px solid rgba(244, 63, 94, 0.4);
    color: var(--accent-rose);
  }

  .modal-footer {
    padding: 16px 24px;
    border-top: 1px solid var(--border-color);
    display: flex;
    justify-content: flex-end;
    gap: 12px;
  }

  .btn-secondary {
    background-color: var(--bg-main);
    border: 1px solid var(--border-color);
    color: var(--text-secondary);
    padding: 10px 18px;
    border-radius: var(--radius-md);
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
  }

  .btn-secondary:hover {
    color: var(--text-primary);
    border-color: var(--border-highlight);
  }

  .btn-primary {
    background-color: var(--accent-blue);
    border: none;
    color: var(--bg-main);
    padding: 10px 20px;
    border-radius: var(--radius-md);
    font-size: 0.9rem;
    font-weight: 700;
    cursor: pointer;
    transition: opacity 0.2s ease;
  }

  .btn-primary:disabled {
    background-color: var(--border-color);
    color: var(--text-muted);
    cursor: not-allowed;
  }

  .btn-primary:not(:disabled):hover {
    opacity: 0.9;
  }

  /* Keyword Intelligence Grid */
  .keyword-intelligence-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-bottom: 24px;
  }

  @media (max-width: 768px) {
    .keyword-intelligence-grid {
      grid-template-columns: 1fr;
    }
  }

  .keyword-card {
    background-color: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-lg);
    padding: 20px 24px;
  }

  .keyword-card.low-rating-card {
    border-color: rgba(244, 63, 94, 0.3);
  }

  .keyword-card-header {
    margin-bottom: 16px;
  }

  .keyword-card-title {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 1.05rem;
    font-weight: 700;
    color: var(--text-primary);
  }

  .keyword-subtitle {
    font-size: 0.8rem;
    color: var(--text-muted);
    font-weight: 400;
  }

  .keyword-badges-container {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    min-height: 48px;
    align-items: center;
  }

  .keyword-badge {
    background-color: var(--bg-main);
    border: 1px solid var(--border-color);
    border-radius: 20px;
    padding: 6px 12px;
    color: var(--text-primary);
    font-size: 0.85rem;
    font-weight: 500;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: all 0.2s ease;
  }

  .keyword-badge:hover {
    border-color: var(--accent-blue);
    color: var(--accent-blue);
    transform: translateY(-1px);
  }

  .keyword-badge.active {
    background-color: rgba(56, 189, 248, 0.15);
    border-color: var(--accent-blue);
    color: var(--accent-blue);
    font-weight: 700;
  }

  .keyword-badge.low-rating-badge:hover {
    border-color: var(--accent-rose);
    color: var(--accent-rose);
  }

  .keyword-badge.low-rating-badge.active {
    background-color: rgba(244, 63, 94, 0.15);
    border-color: var(--accent-rose);
    color: var(--accent-rose);
    font-weight: 700;
  }

  .badge-term {
    color: inherit;
  }

  .badge-count {
    font-size: 0.75rem;
    background-color: rgba(255, 255, 255, 0.1);
    padding: 2px 6px;
    border-radius: 10px;
    color: var(--text-secondary);
  }

  .keyword-empty {
    font-size: 0.85rem;
    color: var(--text-muted);
    padding: 12px 0;
  }

  /* Evidence Drilldown Panel */
  .evidence-panel {
    background-color: var(--bg-card);
    border: 1px solid var(--accent-blue);
    border-radius: var(--radius-lg);
    padding: 20px 24px;
    margin-bottom: 24px;
    animation: evidenceFadeIn 0.2s ease;
  }
